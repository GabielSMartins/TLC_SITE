<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Fotos - TLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css?v=20260802-footer-igreja-final">
</head>
<body data-page="upload" data-base-path="..">
  <header class="site-header">
    <div id="navbar-root"></div>
  </header>

  <main class="page-shell">
    <section class="page-hero mini reveal">
      <div class="container">
        <span class="section-tag">Contribuições</span>
        <h1>Enviar novas fotos para o acervo</h1>
        <p>Compartilhe lembranças do encontro com título, categoria, data e uma breve descrição.</p>
      </div>
    </section>

    <section class="section-pad">
      <div class="container">
        <div class="form-layout">
          <form class="upload-form reveal" id="upload-form" novalidate>
            <div class="input-group">
              <label for="photo-title">Título da foto</label>
              <input type="text" id="photo-title" name="photo-title" placeholder="Ex.: Momento de adoração">
              <small class="field-error" data-error-for="photo-title"></small>
            </div>

            <div class="input-group">
              <label for="photo-category">Categoria</label>
              <select id="photo-category" name="photo-category">
                <option value="">Selecione uma categoria</option>
                <option value="Preparacao">Preparação</option>
                <option value="Oracao">Oração</option>
                <option value="Palestras">Palestras</option>
                <option value="Dinamicas">Dinâmicas</option>
                <option value="Equipe">Equipe</option>
                <option value="Santa Missa">Santa Missa</option>
                <option value="Foto oficial">Foto oficial</option>
              </select>
              <small class="field-error" data-error-for="photo-category"></small>
            </div>

            <div class="input-group">
              <label for="photo-date">Data</label>
              <input type="date" id="photo-date" name="photo-date">
              <small class="field-error" data-error-for="photo-date"></small>
            </div>

            <div class="input-group">
              <label for="photo-description">Descrição</label>
              <textarea id="photo-description" name="photo-description" rows="5" placeholder="Conte o que aconteceu nesse momento."></textarea>
              <small class="field-error" data-error-for="photo-description"></small>
            </div>

            <div class="input-group">
              <label for="photo-image">Escolher imagem</label>
              <input type="file" id="photo-image" name="photo-image" accept="image/*">
              <small class="field-error" data-error-for="photo-image"></small>
            </div>

            <div class="form-message" id="upload-message" aria-live="polite"></div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Enviar foto</button>
              <button type="reset" class="btn btn-secondary" id="cancel-upload">Cancelar</button>
            </div>
          </form>

          <aside class="preview-panel reveal">
            <span class="section-tag">Pré-visualização</span>
            <div class="preview-frame">
              <img id="preview-image" src="https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=900&q=80" alt="Pré-visualização da foto">
            </div>
            <h3 id="preview-title">Sua foto aparecerá aqui</h3>
            <p id="preview-description">Adicione as informações e veja como a lembrança será apresentada na galeria.</p>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="../js/script.js?v=20260802-footer-igreja-final"></script>
</body>
</html>
