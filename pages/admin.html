<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração - TLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css?v=20260802-footer-igreja-final">
</head>
<body data-page="admin" data-base-path="..">
  <header class="site-header">
    <div id="navbar-root"></div>
  </header>

  <main class="page-shell">
    <section class="page-hero mini reveal">
      <div class="container">
        <span class="section-tag">Administração</span>
        <h1>Área exclusiva do administrador</h1>
        <p>Veja os pedidos de acesso e libere somente quem pode entrar no site.</p>
      </div>
    </section>

    <section class="section-pad">
      <div class="container">
        <div class="metrics-grid reveal" id="admin-summary">
          <article class="metric-card interactive-card">
            <i class="fa-solid fa-hourglass-half"></i>
            <strong class="metric-number" id="admin-pending-count">0</strong>
            <span>Pedidos pendentes</span>
          </article>
          <article class="metric-card interactive-card">
            <i class="fa-solid fa-circle-check"></i>
            <strong class="metric-number" id="admin-approved-count">0</strong>
            <span>Aprovados</span>
          </article>
          <article class="metric-card interactive-card">
            <i class="fa-solid fa-circle-xmark"></i>
            <strong class="metric-number" id="admin-denied-count">0</strong>
            <span>Negados</span>
          </article>
        </div>

        <section class="admin-panel reveal">
          <div class="section-heading compact">
            <span class="section-tag">Controle</span>
            <h2>Pedidos de acesso</h2>
            <p>Aprovar ou negar por aqui já deixa o site pronto para a pessoa certa entrar.</p>
          </div>
          <div class="form-message" id="admin-message" aria-live="polite"></div>
          <div class="admin-request-list" id="admin-request-list"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="../js/script.js?v=20260802-footer-igreja-final"></script>
</body>
</html>
